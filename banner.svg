<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,20px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-15px); } }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fade { opacity: 0; animation: fade 0.8s ease-out forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.4s; } .d3 { animation-delay: 0.7s; } .d4 { animation-delay: 1s; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .line { stroke-dasharray: 6 10; animation: dash 20s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -400; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle class="float1" cx="180" cy="60" r="220" fill="url(#glow1)"/>
  <circle class="float2" cx="1050" cy="260" r="240" fill="url(#glow2)"/>

  <!-- Left: intro -->
  <g class="sans">
    <text class="mono fade d1" x="70" y="88" font-size="18" fill="#22d3ee">~/ehsanmaruf $ whoami</text>
    <text class="fade d2" x="68" y="148" font-size="52" font-weight="800" fill="#ffffff">Mohammad Maruf</text>
    <text class="fade d3" x="70" y="188" font-size="24" font-weight="600" fill="url(#accent)">Full Stack Developer · DevOps · AI Integrations</text>
    <text class="mono fade d4" x="70" y="232" font-size="16" fill="#9ca3af">Building the Member Lounge portal<tspan class="cursor" fill="#22d3ee"> ▋</tspan></text>
  </g>
  <rect x="70" y="256" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Right: code card -->
  <g transform="translate(760 48)">
    <rect width="380" height="204" rx="14" fill="#0b1020" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="22" r="6" fill="#febc2e"/>
    <circle cx="62" cy="22" r="6" fill="#28c840"/>
    <text class="mono" x="300" y="27" font-size="12" fill="#6b7280">stack.ts</text>
    <g class="mono" font-size="15">
      <text x="22" y="64"><tspan fill="#c084fc">const</tspan><tspan fill="#e5e7eb"> maruf = {</tspan></text>
      <text x="42" y="92"><tspan fill="#7dd3fc">frontend</tspan><tspan fill="#e5e7eb">: </tspan><tspan fill="#86efac">"React · TS · Tailwind"</tspan></text>
      <text x="42" y="118"><tspan fill="#7dd3fc">backend</tspan><tspan fill="#e5e7eb">: </tspan><tspan fill="#86efac">"Node · Express"</tspan></text>
      <text x="42" y="144"><tspan fill="#7dd3fc">data</tspan><tspan fill="#e5e7eb">: </tspan><tspan fill="#86efac">"PostgreSQL · MongoDB"</tspan></text>
      <text x="42" y="170"><tspan fill="#7dd3fc">ops</tspan><tspan fill="#e5e7eb">: </tspan><tspan fill="#86efac">"Docker · CI/CD · AI"</tspan></text>
      <text x="22" y="194" fill="#e5e7eb">};</text>
    </g>
  </g>

  <path class="line" d="M0 296 H1200" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6"/>
</svg>
